# OPTIONAL: private HTTPS access through Tailscale (no router port forwarding, nothing public).
# The app gets its own device in your tailnet, e.g. https://jarbou-recruiting.<your-tailnet>.ts.net
#
# Start together with the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
# Requirements: TS_AUTHKEY in .env (Tailscale admin console → Settings → Keys), MagicDNS + HTTPS
# certificates enabled in the Tailscale admin console (DNS page). See README-UGREEN.md, section 15.
services:
  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-jarbou-recruiting}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-jarbou-recruiting}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    networks: [web]
    depends_on:
      app:
        condition: service_healthy

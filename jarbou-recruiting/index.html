<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>JARBOU Recruiting Command Center</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <img class="logo-full" src="assets/jarbou-logo.svg" alt="JARBOU Logistik GmbH">
        <img class="logo-mark" src="assets/jarbou-mark.svg" alt="JARBOU">
        <div class="app-name">Recruiting Command Center</div>
        <div class="project-tag" id="sidebar-project"><span class="dhl-dot" aria-hidden="true"></span><span>DHL Express Project</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="collapse-btn" data-action="toggle-sidebar" title="Collapse / expand sidebar"><svg class="i sm" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Collapse</span></button>
        <div class="foot-text">
          <strong id="foot-company">JARBOU Logistik GmbH</strong>
          <span class="internal"><svg class="i sm" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Internal Use Only</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="open-mobile-nav" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <select class="scope-select" id="scope-select" title="Project scope — applies to all pages" aria-label="Project scope"></select>
        <div class="global-search" id="global-search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="gs-input" placeholder="Find candidate by name, ID, phone…" autocomplete="off" aria-label="Quick find candidate">
          <kbd>Ctrl K</kbd>
          <div class="gs-results" id="gs-results" hidden></div>
        </div>
        <button class="btn primary" data-action="add-candidate"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">Add Candidate</span></button>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="print-root"></div>
  <noscript><p style="padding:40px;font-family:sans-serif">This application requires JavaScript to be enabled in your browser.</p></noscript>

  <!-- All scripts are local. No data is sent to any server. -->
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/io.js"></script>
  <script src="js/print.js"></script>
  <script src="js/form.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/candidates.js"></script>
  <script src="js/views/pipeline.js"></script>
  <script src="js/views/onboarding.js"></script>
  <script src="js/views/documents.js"></script>
  <script src="js/views/starting.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/archive.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

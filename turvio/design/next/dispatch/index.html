:root{
  --bg:#090B11;--bg-2:#0D1018;--surface:#141821;--surface-2:#1A1F2B;--raised:#212736;--navy:#111B30;
  --line:rgba(166,180,224,.09);--line-2:rgba(166,180,224,.17);--line-3:rgba(166,180,224,.28);
  --text:#F1F3F9;--text-2:#B4BBCC;--text-3:#8A93A8;
  --violet:#6F55FF;--violet-hi:#8C76FF;--violet-text:#AA9BFF;--on-violet:#FFFFFF;
  --cobalt:#3478FF;--cobalt-text:#7DA8FF;--cyan:#18D9E8;--mint:#2CE6A6;--coral:#FF718B;--amber:#FFB85C;
  --violet-soft:rgba(117,91,255,.15);--cobalt-soft:rgba(52,120,255,.14);--cyan-soft:rgba(24,217,232,.12);--mint-soft:rgba(44,230,166,.12);--coral-soft:rgba(255,113,139,.13);--amber-soft:rgba(255,184,92,.13);
  --chart-grid:rgba(166,180,224,.08);--chart-label:#7E879C;
  --shadow-sm:0 1px 0 rgba(255,255,255,.035) inset,0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px -8px rgba(0,0,0,.55);
  --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset,0 24px 60px -12px rgba(0,0,0,.7);
  --hero-bg:radial-gradient(120% 140% at 100% 0%,rgba(117,91,255,.42) 0%,rgba(52,120,255,.16) 38%,rgba(17,27,48,0) 70%),linear-gradient(160deg,#141B33 0%,#101629 45%,#0E121D 100%);
  --hero-line:rgba(170,155,255,.28);--hero-text-2:#C3C9DC;
  --sidebar:#0C0F16;--glow:0 0 0 1px rgba(117,91,255,.35),0 8px 30px -6px rgba(117,91,255,.55);
  --font:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
  --r-sm:10px;--r:16px;--r-lg:22px;
  --ease:cubic-bezier(.2,.75,.25,1);--ease-spring:cubic-bezier(.34,1.4,.5,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F6F4EF;--bg-2:#EFECE5;--surface:#FFFFFF;--surface-2:#FAF8F4;--raised:#FFFFFF;--navy:#EEF0F8;
  --line:rgba(44,40,66,.085);--line-2:rgba(44,40,66,.15);--line-3:rgba(44,40,66,.26);
  --text:#161922;--text-2:#454B5C;--text-3:#646A7C;
  --violet:#5B44E8;--violet-hi:#6A55F0;--violet-text:#4A34D4;--on-violet:#FFFFFF;
  --cobalt:#2563EB;--cobalt-text:#1D4FC4;--cyan:#0A8B99;--mint:#0B8A5F;--coral:#CF3558;--amber:#A35C00;
  --violet-soft:rgba(91,68,232,.09);--cobalt-soft:rgba(37,99,235,.08);--cyan-soft:rgba(10,139,153,.09);--mint-soft:rgba(11,138,95,.09);--coral-soft:rgba(207,53,88,.08);--amber-soft:rgba(163,92,0,.09);
  --chart-grid:rgba(44,40,66,.07);--chart-label:#6E7385;
  --shadow-sm:0 1px 2px rgba(30,26,50,.05);
  --shadow:0 1px 2px rgba(30,26,50,.04),0 10px 28px -10px rgba(30,26,50,.12);
  --shadow-lg:0 2px 6px rgba(30,26,50,.05),0 28px 60px -18px rgba(30,26,50,.22);
  --hero-bg:radial-gradient(120% 140% at 100% 0%,rgba(122,98,255,.30) 0%,rgba(80,140,255,.14) 40%,rgba(255,255,255,0) 72%),linear-gradient(160deg,#FFFFFF 0%,#F4F2FF 55%,#EEF3FF 100%);
  --hero-line:rgba(91,68,232,.22);--hero-text-2:#4D5366;
  --sidebar:#FBFAF7;--glow:0 0 0 1px rgba(91,68,232,.25),0 8px 24px -8px rgba(91,68,232,.45);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F6F4EF;--bg-2:#EFECE5;--surface:#FFFFFF;--surface-2:#FAF8F4;--raised:#FFFFFF;--navy:#EEF0F8;
  --line:rgba(44,40,66,.085);--line-2:rgba(44,40,66,.15);--line-3:rgba(44,40,66,.26);
  --text:#161922;--text-2:#454B5C;--text-3:#646A7C;
  --violet:#5B44E8;--violet-hi:#6A55F0;--violet-text:#4A34D4;--on-violet:#FFFFFF;
  --cobalt:#2563EB;--cobalt-text:#1D4FC4;--cyan:#0A8B99;--mint:#0B8A5F;--coral:#CF3558;--amber:#A35C00;
  --violet-soft:rgba(91,68,232,.09);--cobalt-soft:rgba(37,99,235,.08);--cyan-soft:rgba(10,139,153,.09);--mint-soft:rgba(11,138,95,.09);--coral-soft:rgba(207,53,88,.08);--amber-soft:rgba(163,92,0,.09);
  --chart-grid:rgba(44,40,66,.07);--chart-label:#6E7385;
  --shadow-sm:0 1px 2px rgba(30,26,50,.05);
  --shadow:0 1px 2px rgba(30,26,50,.04),0 10px 28px -10px rgba(30,26,50,.12);
  --shadow-lg:0 2px 6px rgba(30,26,50,.05),0 28px 60px -18px rgba(30,26,50,.22);
  --hero-bg:radial-gradient(120% 140% at 100% 0%,rgba(122,98,255,.30) 0%,rgba(80,140,255,.14) 40%,rgba(255,255,255,0) 72%),linear-gradient(160deg,#FFFFFF 0%,#F4F2FF 55%,#EEF3FF 100%);
  --hero-line:rgba(91,68,232,.22);--hero-text-2:#4D5366;
  --sidebar:#FBFAF7;--glow:0 0 0 1px rgba(91,68,232,.25),0 8px 24px -8px rgba(91,68,232,.45);
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir="rtl"] body{font-family:var(--font-ar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus-visible{outline:2px solid var(--violet-hi);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;width:264px;background:var(--sidebar);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;transition:width .34s var(--ease);z-index:30}
.app.collapsed .side{width:84px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;min-height:58px}
.brand-mark{width:36px;height:36px;flex:none;border-radius:11px;background:conic-gradient(from 200deg at 60% 40%,#18D9E8,#3478FF,#755BFF,#B07CFF,#18D9E8);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(117,91,255,.7);position:relative}
.brand-mark::after{content:"";position:absolute;inset:1.5px;border-radius:10px;background:linear-gradient(160deg,rgba(9,11,17,.15),rgba(9,11,17,.55))}
.brand-mark svg{position:relative;z-index:1}
.brand-word{font-weight:800;font-size:17px;letter-spacing:.16em;white-space:nowrap}
.brand-sub{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.fade{transition:opacity .2s var(--ease),transform .3s var(--ease)}
.app.collapsed .fade{opacity:0;pointer-events:none;transform:translateX(-6px)}
[dir="rtl"] .app.collapsed .fade{transform:translateX(6px)}
.nav{position:relative;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:14px 12px 6px;white-space:nowrap}
.app.collapsed .nav-label{opacity:0;height:14px;padding-top:6px}
.nav-ind{position:absolute;inset-inline:0;height:42px;border-radius:12px;background:var(--violet-soft);box-shadow:inset 0 0 0 1px rgba(117,91,255,.28);transition:transform .38s var(--ease-spring),opacity .2s;pointer-events:none}
.nav-ind::before{content:"";position:absolute;inset-inline-start:-14px;top:11px;width:3px;height:20px;border-radius:3px;background:linear-gradient(var(--cyan),var(--violet))}
.nav a{position:relative;display:flex;align-items:center;gap:13px;height:42px;padding:0 12px;border-radius:12px;color:var(--text-2);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;transition:color .2s,background .2s}
.nav a:hover{color:var(--text);background:rgba(166,180,224,.06)}
.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"] svg{color:var(--violet-text)}
.nav a svg{flex:none;width:20px;height:20px;transition:transform .3s var(--ease-spring)}
.nav a:active svg{transform:scale(.88)}
.nav .count{margin-inline-start:auto;font-size:11.5px;font-weight:700;color:var(--text-3);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:99px}
.nav .count.alert{color:var(--coral);background:var(--coral-soft);border-color:transparent}
.app.collapsed .nav a .count{position:absolute;inset-inline-end:8px;top:6px;padding:0;width:8px;height:8px;font-size:0;border:0}
.side-foot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.collapse-btn{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--text-3);font-weight:600;white-space:nowrap}
.collapse-btn:hover{color:var(--text);background:rgba(166,180,224,.06)}
.collapse-btn svg{transition:transform .34s var(--ease)}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
[dir="rtl"] .collapse-btn svg{transform:rotate(180deg)}
[dir="rtl"] .app.collapsed .collapse-btn svg{transform:none}
.me{display:flex;align-items:center;gap:11px;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s;text-align:start;width:100%}
.me:hover{border-color:var(--line-2)}
.avatar{position:relative;width:34px;height:34px;flex:none;border-radius:11px;background:linear-gradient(135deg,#2B3550,#1A2032);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#E6E9F5}
:root[data-theme="light"] .avatar{background:linear-gradient(135deg,#E4E1F7,#D9E3F8);color:#2A2550}
.env-dot{position:absolute;inset-inline-end:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--surface)}
.me-name{font-weight:700;font-size:13px;white-space:nowrap}
.me-role{font-size:11.5px;color:var(--text-3);white-space:nowrap}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
.icon-btn.menu-btn{display:none}
.search{display:flex;align-items:center;gap:10px;height:40px;width:min(380px,40vw);padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text-3);font-weight:500;transition:border-color .2s,box-shadow .2s}
.search:hover{border-color:var(--line-2)}
.kbd{margin-inline-start:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--text-3)}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text-2);transition:transform .15s var(--ease),border-color .2s,color .2s,background .2s}
.icon-btn:hover{color:var(--text);border-color:var(--line-2)}
.icon-btn:active{transform:scale(.93)}
.badge-dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--surface)}

/* theme switch */
.theme-switch{position:relative;width:64px;height:34px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);padding:3px;display:flex;align-items:center}
.theme-switch .knob{width:26px;height:26px;border-radius:50%;background:linear-gradient(140deg,#8C76FF,#3478FF);box-shadow:0 4px 12px -2px rgba(117,91,255,.6);display:grid;place-items:center;color:#fff;transition:transform .45s var(--ease-spring),background .4s}
:root[data-theme="light"] .theme-switch .knob{transform:translateX(30px);background:linear-gradient(140deg,#FFC66B,#FF8A6B);box-shadow:0 4px 12px -2px rgba(255,138,107,.55)}
[dir="rtl"] .theme-switch .knob{transform:translateX(0)}
[dir="rtl"]:root[data-theme="light"] .theme-switch .knob{transform:translateX(-30px)}
.theme-switch .knob svg{transition:transform .5s var(--ease-spring)}
:root[data-theme="light"] .theme-switch .knob svg{transform:rotate(180deg)}
.theme-switch .ic-sun{display:none}
:root[data-theme="light"] .theme-switch .ic-sun{display:block}
:root[data-theme="light"] .theme-switch .ic-moon{display:none}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .2s,border-color .2s;white-space:nowrap;overflow:hidden}
.btn:hover{border-color:var(--line-3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn-primary{border:0;color:var(--on-violet);background:linear-gradient(135deg,var(--violet-hi) 0%,var(--violet) 55%,#4F3BE0 100%);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 8px 20px -8px rgba(117,91,255,.8)}
.btn-primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 12px 28px -8px rgba(117,91,255,.95)}
.btn-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn-primary:hover::after{transform:translateX(120%)}
.btn .spin{display:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.btn.loading .spin{display:block}
.btn.loading .lbl,.btn.loading .bi{opacity:.0;width:0;overflow:hidden}
.btn.done{background:linear-gradient(135deg,#1FC98F,#0EA673);box-shadow:0 8px 20px -8px rgba(44,230,166,.7)}
.btn .ok{display:none}
.btn.done .ok{display:block;animation:pop .45s var(--ease-spring)}
.btn.done .lbl,.btn.done .bi{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* segmented */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);isolation:isolate}
.seg button{position:relative;z-index:1;height:32px;padding:0 13px;border:0;background:transparent;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--text-3);transition:color .25s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg-ind{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:9px;background:var(--raised);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 8px rgba(0,0,0,.25),0 0 0 1px var(--line-2);transition:transform .4s var(--ease-spring),width .4s var(--ease-spring)}
:root[data-theme="light"] .seg-ind{box-shadow:0 1px 3px rgba(30,26,50,.12),0 0 0 1px var(--line)}
.seg.sm button{height:28px;padding:0 10px;font-size:12px}

/* dropdown */
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--text);transition:border-color .2s}
.dd-btn:hover{border-color:var(--line-2)}
.dd-btn .chev{color:var(--text-3);transition:transform .3s var(--ease)}
.dd.open .dd-btn .chev{transform:rotate(180deg)}
.dd-btn .k{color:var(--text-3);font-weight:600}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:240px;padding:6px;border-radius:16px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .18s var(--ease),transform .25s var(--ease);z-index:50}
[dir="rtl"] .menu{transform-origin:top left}
.menu.start{inset-inline-end:auto;inset-inline-start:0;transform-origin:top left}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}
.menu-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:7px 10px;border:0;border-radius:10px;background:transparent;text-align:start;font-weight:600;font-size:13px;color:var(--text);transition:background .15s}
.mi:hover,.mi:focus-visible{background:var(--surface-2)}
.mi .sub{display:block;font-size:11.5px;font-weight:500;color:var(--text-3)}
.mi .check{margin-inline-start:auto;color:var(--violet-text);opacity:0;transform:scale(.6);transition:all .25s var(--ease-spring)}
.mi[aria-checked="true"] .check{opacity:1;transform:none}
.flag{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
.menu-sep{height:1px;background:var(--line);margin:6px 4px}

/* tooltips */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);white-space:normal;width:max-content;max-width:240px;padding:7px 10px;border-radius:10px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);font-size:12px;font-weight:500;line-height:1.4;color:var(--text);opacity:0;pointer-events:none;transition:opacity .15s,transform .2s var(--ease);z-index:60;text-transform:none;letter-spacing:0}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.app.collapsed .nav a[data-tip]::after{bottom:auto;top:50%;left:calc(100% + 12px);transform:translate(-4px,-50%)}
.app.collapsed .nav a[data-tip]:hover::after{transform:translate(0,-50%)}
.app:not(.collapsed) .nav a[data-tip]::after{display:none}
[dir="rtl"] .app.collapsed .nav a[data-tip]::after{left:auto;right:calc(100% + 12px)}

/* page */
.page{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1680px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.page-sub{color:var(--text-2);font-size:14px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill-demo{background:var(--amber-soft);color:var(--amber)}
.filters{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;min-width:0;transition:border-color .25s,transform .3s var(--ease),box-shadow .3s var(--ease)}
.card.hov:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-t{font-size:15.5px;font-weight:750;font-weight:700;letter-spacing:-.01em}
.card-d{font-size:12.5px;color:var(--text-3);margin-top:1px}
.card-h .act{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.info{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;color:var(--text-3);border:0;background:transparent}
.info:hover{color:var(--text);background:var(--surface-2)}

/* hero */
.hero{grid-column:span 8;position:relative;overflow:hidden;border-radius:26px;padding:26px 28px 0;background:var(--hero-bg);border:1px solid var(--hero-line);box-shadow:var(--shadow-lg);min-height:330px;display:flex;flex-direction:column}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(80% 90% at 85% 10%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(80% 90% at 85% 10%,#000 0%,transparent 70%);opacity:.35;pointer-events:none}
.hero-top{position:relative;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-text)}
.hero-num{font-size:64px;font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:10px}
.hero-label{font-size:15px;font-weight:600;color:var(--hero-text-2);margin-top:8px}
.delta{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:700}
.delta.up{background:var(--mint-soft);color:var(--mint)}
.delta.down{background:var(--coral-soft);color:var(--coral)}
.delta.flat{background:var(--surface-2);color:var(--text-3)}
.delta.up.bad{background:var(--coral-soft);color:var(--coral)}
.delta.down.good{background:var(--mint-soft);color:var(--mint)}
.hero-stats{margin-inline-start:auto;display:grid;grid-template-columns:repeat(3,auto);gap:10px 30px;padding-top:6px}
.hs-v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.hs-l{font-size:12.5px;color:var(--hero-text-2);font-weight:600}
.hero-chart{position:relative;margin:18px -28px 0;flex:1;min-height:150px}
.ring-wrap{display:flex;align-items:center;gap:12px}

/* live today */
.live{grid-column:span 4;display:flex;flex-direction:column}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(44,230,166,.6);animation:livep 2.4s infinite}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(44,230,166,.55)}70%{box-shadow:0 0 0 8px rgba(44,230,166,0)}100%{box-shadow:0 0 0 0 rgba(44,230,166,0)}}
.loc-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cobalt),var(--cyan));width:0;transition:width 1s var(--ease)}

/* kpi */
.kpi{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline:22px;top:-1px;height:1.5px;border-radius:2px;background:var(--acc,var(--violet));opacity:.85}
.kpi-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft,var(--violet-soft));color:var(--acc,var(--violet-text))}
.kpi-v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi-v small{font-size:15px;color:var(--text-3);font-weight:700;letter-spacing:0}
.kpi-l{font-size:13px;color:var(--text-2);font-weight:600}
.kpi-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--acc,var(--violet));width:0;transition:width 1.1s var(--ease)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.ax{font-size:11px;fill:var(--chart-label);font-weight:600}
.reveal-line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.reveal-area{opacity:0;animation:fadein .9s .25s var(--ease) forwards}
@keyframes fadein{to{opacity:1}}
.bar-g rect.b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s var(--ease) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.hbar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:growx .9s var(--ease) forwards}
[dir="rtl"] .hbar{transform-origin:right}
@keyframes growx{to{transform:scaleX(1)}}
.tip{position:absolute;pointer-events:none;min-width:170px;padding:10px 12px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);font-size:12.5px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .15s var(--ease);z-index:10}
.tip.on{opacity:1;transform:none}
.tip-h{font-weight:700;margin-bottom:6px}
.tip-r{display:flex;align-items:center;gap:8px;color:var(--text-2)}
.tip-r b{margin-inline-start:auto;color:var(--text);font-weight:700}
.sw{width:9px;height:9px;border-radius:3px;flex:none}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg-btn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:600;color:var(--text-2);transition:opacity .2s,border-color .2s}
.lg-btn[aria-pressed="false"]{opacity:.45}
.lg-btn:hover{border-color:var(--line-2)}
.lg-dash{width:14px;height:0;border-top:2px dashed var(--text-3)}

/* toggle switch */
.tgl{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2);user-select:none}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl .tr{width:38px;height:22px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;transition:background .3s var(--ease),border-color .3s}
.tgl .tr::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--text-3);transition:transform .35s var(--ease-spring),background .3s,width .2s}
.tgl:active .tr::after{width:20px}
.tgl input:checked+.tr{background:var(--violet);border-color:transparent}
.tgl input:checked+.tr::after{transform:translateX(16px);background:#fff}
[dir="rtl"] .tgl input:checked+.tr::after{transform:translateX(-16px)}
.tgl input:focus-visible+.tr{outline:2px solid var(--violet-hi);outline-offset:2px}

/* lists */
.rlist{display:flex;flex-direction:column;gap:12px}
.reason{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;cursor:pointer;padding:6px 8px;margin:0 -8px;border-radius:10px;transition:background .2s;border:0;background:transparent;text-align:start;width:calc(100% + 16px)}
.reason:hover{background:var(--surface-2)}
.reason .rb{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.reason .rb i{display:block;height:100%;border-radius:99px}
.reason.dim{opacity:.4}

table{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);text-align:start;padding:0 12px 10px;white-space:nowrap}
.tbl td{padding:12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr.row{cursor:pointer;transition:background .2s}
.tbl tr.row:hover td{background:var(--surface-2)}
.tbl tr.row td:first-child{border-start-start-radius:12px;border-end-start-radius:12px}
.tbl tr.row td:last-child{border-start-end-radius:12px;border-end-end-radius:12px}
.tbl .chev{transition:transform .3s var(--ease);color:var(--text-3)}
.tbl tr.row.open .chev{transform:rotate(90deg)}
[dir="rtl"] .tbl .chev{transform:scaleX(-1)}
[dir="rtl"] .tbl tr.row.open .chev{transform:rotate(90deg)}
.xp td{padding:0 !important;border-top:0 !important}
.xp-in{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.xp.open .xp-in{grid-template-rows:1fr}
.xp-in>div{overflow:hidden}
.xp-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:6px 12px 16px}
.mini{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.mini b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.mini span{font-size:12px;color:var(--text-3);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:700}
.t-ok{background:var(--mint-soft);color:var(--mint)}.t-warn{background:var(--amber-soft);color:var(--amber)}.t-bad{background:var(--coral-soft);color:var(--coral)}.t-info{background:var(--cobalt-soft);color:var(--cobalt-text)}.t-vi{background:var(--violet-soft);color:var(--violet-text)}.t-mute{background:var(--surface-2);color:var(--text-3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* activity */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:12px;transition:background .2s}
.fi:hover{background:var(--surface-2)}
.fi-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.fi-t{font-weight:650;font-weight:600;font-size:13.5px}
.fi-s{font-size:12.5px;color:var(--text-3)}
.fi-time{font-size:12px;color:var(--text-3);font-weight:600;white-space:nowrap}
.fi-more{grid-column:2/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.fi.open .fi-more{grid-template-rows:1fr}
.fi-more>div{overflow:hidden}
.fi-more .inner{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);font-size:12.5px;color:var(--text-2);display:flex;gap:16px;flex-wrap:wrap}
.health{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.warn{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.warn .sv{align-self:stretch;border-radius:4px}

/* map */
.map{position:relative;border-radius:16px;overflow:hidden;background:var(--bg-2);border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.depot{cursor:pointer}
.depot .halo{transition:r .4s var(--ease),opacity .3s}
.depot:hover .halo,.depot.sel .halo{opacity:.55}
.depot .core{transition:r .35s var(--ease-spring)}
.depot:hover .core{r:9}
.map-legend{position:absolute;inset-inline-start:12px;bottom:12px;display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--text-2)}
.heat{width:80px;height:6px;border-radius:9px;background:linear-gradient(90deg,rgba(52,120,255,.15),var(--cobalt),var(--violet),var(--coral))}
.inset{position:absolute;top:12px;inset-inline-end:12px;width:82px;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line)}

/* view transitions */
.view{animation:viewin .45s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* toasts */
.toasts{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));inset-inline-end:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;z-index:90}
.toast{display:flex;align-items:center;gap:12px;min-width:280px;max-width:380px;padding:12px 14px;border-radius:16px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);animation:tin .45s var(--ease-spring);font-weight:600;font-size:13px}
.toast.out{animation:tout .3s var(--ease) forwards}
.toast .ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.97)}}

/* command palette */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
:root[data-theme="light"] .scrim{background:rgba(40,36,60,.22)}
.scrim.on{opacity:1;pointer-events:auto}
.cmd{position:fixed;top:12vh;left:50%;width:min(620px,calc(100% - 32px));transform:translate(-50%,-10px) scale(.97);opacity:0;pointer-events:none;z-index:81;border-radius:22px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);transition:opacity .2s,transform .3s var(--ease-spring);overflow:hidden}
.cmd.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.cmd input{width:100%;height:58px;border:0;background:transparent;padding:0 20px;font-size:16px;outline:none;border-bottom:1px solid var(--line)}
.cmd-list{max-height:360px;overflow:auto;padding:8px}
.cmd-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;text-align:start;font-weight:600}
.cmd-item[aria-selected="true"],.cmd-item:hover{background:var(--surface-2)}
.cmd-item .k{margin-inline-start:auto;font-size:12px;color:var(--text-3);font-weight:600}

/* roles matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:start}
.yes{color:var(--mint)}.no{color:var(--text-3);opacity:.5}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:56px 20px}
.empty-art{width:120px;height:120px;border-radius:32px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,var(--violet-soft),transparent 70%),var(--surface-2);border:1px solid var(--line);color:var(--violet-text)}
.setrow{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.setrow .grow{flex:1;min-width:0}

/* responsive */
@media (max-width:1280px){
  .hero,.live{grid-column:span 12}
  .s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(-100%);transition:transform .35s var(--ease);box-shadow:var(--shadow-lg);width:272px !important}
  [dir="rtl"] .side{transform:translateX(100%)}
  .app.mnav .side{transform:none}
  .app.collapsed .fade{opacity:1;transform:none;pointer-events:auto}
  .icon-btn.menu-btn{display:grid}
  .topbar{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .search{width:auto;flex:1}.search .kbd,.search .stxt{display:none}
  .page{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .s3,.s6{grid-column:span 12}
  .hero{padding:20px 18px 0}.hero-chart{margin:auto -18px 0}
  .hero-num{font-size:46px}
  .hero-stats{margin-inline-start:0;grid-template-columns:repeat(3,auto);gap:8px 18px}
  .xp-body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-sm{display:none !important}
  .tbl-wrap{overflow-x:auto}
  .filters{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .reveal-line{stroke-dashoffset:0}
}
.calm *,.calm *::before,.calm *::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
.seg-ind{left:0}
.main{overflow-x:clip}
.menu{max-width:calc(100vw - 32px)}
.delta{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .num{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] div.num{text-align:right}
@media (max-width:860px){.filters .menu{inset-inline-start:0;inset-inline-end:auto;transform-origin:top left}[dir="rtl"] .filters .menu{transform-origin:top right}}
:root{--m-bg:#0B0E16;--m-bldg:#131927;--m-st:#222A3C;--m-maj:#313B55;--m-maj-c:#0A0D14;--m-mot:#39405E;--m-mot-c:#0A0D14;--m-water:#0E2238;--m-river:#11314F;--m-park:#0F1C17;--m-rail:#2A3043;--m-label:#6F7891;--m-label-strong:#AEB6CB;--m-halo:#0D111A;--m-shield:#1D2335}
:root[data-theme="light"]{--m-bg:#EFEDE7;--m-bldg:#E2DED4;--m-st:#FFFFFF;--m-maj:#FFFFFF;--m-maj-c:#D6D2C8;--m-mot:#F6E7C8;--m-mot-c:#D9C08C;--m-water:#C7DCEF;--m-river:#BBD4EC;--m-park:#D7E8D2;--m-rail:#C3BFB6;--m-label:#7A7F8F;--m-label-strong:#3E4354;--m-halo:#EFEDE7;--m-shield:#FFFFFF}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--m-bg:#EFEDE7;--m-bldg:#E2DED4;--m-st:#FFFFFF;--m-maj:#FFFFFF;--m-maj-c:#D6D2C8;--m-mot:#F6E7C8;--m-mot-c:#D9C08C;--m-water:#C7DCEF;--m-river:#BBD4EC;--m-park:#D7E8D2;--m-rail:#C3BFB6;--m-label:#7A7F8F;--m-label-strong:#3E4354;--m-halo:#EFEDE7;--m-shield:#FFFFFF}}
.m-bg{fill:var(--m-bg)}
.m-st{fill:none;stroke:var(--m-st);stroke-width:1.15;vector-effect:non-scaling-stroke;stroke-linecap:round}
.m-park{fill:var(--m-park)}
.m-water{fill:var(--m-water)}
.m-river{fill:none;stroke:var(--m-river);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.m-rail{fill:none;stroke:var(--m-rail);stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.m-maj-c{fill:none;stroke:var(--m-maj-c);stroke-width:5.2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-maj{fill:none;stroke:var(--m-maj);stroke-width:3.4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-mot-c{fill:none;stroke:var(--m-mot-c);stroke-width:7.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-mot{fill:none;stroke:var(--m-mot);stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.m-dl{fill:var(--m-label);font-weight:700;paint-order:stroke;stroke:var(--m-halo);stroke-linejoin:round}
.m-lm{fill:var(--m-label-strong);font-weight:600;paint-order:stroke;stroke:var(--m-halo);stroke-linejoin:round}
.m-lm.w{fill:#4E8FC7;font-style:italic}
:root[data-theme="light"] .m-lm.w{fill:#3D78AE}
.m-lm.p{fill:#4F9B72;font-style:italic}
.m-sl{fill:var(--m-label);font-weight:600;paint-order:stroke;stroke:var(--m-halo)}
.m-hbf{fill:var(--m-bg);stroke:var(--m-label-strong)}
.m-shield{fill:var(--m-shield);stroke:var(--m-mot-c)}
.m-shield-t{fill:var(--m-label-strong);font-weight:700}

.m-bldg{fill:var(--m-bldg)}
.hit-route{fill:none;stroke:transparent;stroke-width:16;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
.route-flow{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:2 12;stroke-linecap:round;animation:rflow 1.4s linear infinite;pointer-events:none}
:root[data-theme="light"] .route-flow{stroke-opacity:.85}
@keyframes rflow{to{stroke-dashoffset:-28}}
.map-tip{position:absolute;z-index:8;pointer-events:none;min-width:0;white-space:nowrap}
.ws.max{position:fixed !important;inset:12px !important;z-index:70;height:auto !important;min-height:0 !important}
.ws.max ~ *{visibility:visible}
@media (prefers-reduced-motion:reduce){.route-flow{animation:none}}
/* ---------- Dispatch workspace (extends the approved Admin system) ---------- */
.page.ws-page{max-width:none;padding-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kp{position:relative;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;transition:border-color .25s,transform .3s var(--ease)}
.kp:hover{border-color:var(--line-2);transform:translateY(-2px)}
.kp::before{content:"";position:absolute;inset-inline:18px;top:-1px;height:1.5px;border-radius:2px;background:var(--acc,var(--violet));opacity:.85}

let cmdSel = 0, cmdItems = [];
function cmdData() { return [...Object.keys(VIEWS).map(k => ({ ic: k, label: t(k), k: t('cmdGo'), run: () => go(k) })),
  ...TOURS.map(x => ({ ic: 'tours', label: `${x.code} · ${x.area}`, k: x.day ? t('planning') : (drv(x.driver)?.name || ''), run: () => { if (x.day) { S.planTour = x.id; go('planning'); } else { if (!['overview', 'live'].includes(S.section)) go('overview'); selectTour(x.id, true); } } })),
  { ic: 'sun', label: t('cmdTheme'), k: '', run: () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light') },
  ...[['de', 'Deutsch'], ['en', 'English'], ['ar', 'العربية']].filter(([c]) => c !== S.lang).map(([c, n]) => ({ ic: 'globe', label: `${t('cmdLang')}: ${n}`, k: '', run: () => setLang(c) }))]; }
function openCmd() { $('#scrim').classList.add('on'); $('#cmd').classList.add('on'); const i = $('#cmd-in'); i.placeholder = t('cmdPh'); i.value = ''; cmdSel = 0; drawCmd(''); setTimeout(() => i.focus(), 30); }
function closeCmd() { $('#cmd').classList.remove('on'); if (!$('#dlg').classList.contains('on')) $('#scrim').classList.remove('on'); }
function drawCmd(q) { cmdItems = cmdData().filter(x => x.label.toLowerCase().includes(q.toLowerCase())); cmdSel = Math.min(cmdSel, Math.max(0, cmdItems.length - 1));
  $('#cmd-list').innerHTML = cmdItems.map((x, i) => `<button class="cmd-item" type="button" data-i="${i}" aria-selected="${i === cmdSel}">${ic(x.ic, 18)}${x.label}<span class="k">${x.k}</span></button>`).join(''); }
$('#cmd-in').addEventListener('input', e => { cmdSel = 0; drawCmd(e.target.value); });
$('#cmd-in').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { cmdSel = Math.min(cmdItems.length - 1, cmdSel + 1); drawCmd(e.target.value); e.preventDefault(); } if (e.key === 'ArrowUp') { cmdSel = Math.max(0, cmdSel - 1); drawCmd(e.target.value); e.preventDefault(); } if (e.key === 'Enter' && cmdItems[cmdSel]) { const it = cmdItems[cmdSel]; closeCmd(); it.run(); } });
$('#cmd-list').addEventListener('click', e => { const b = e.target.closest('.cmd-item'); if (!b) return; const it = cmdItems[+b.dataset.i]; closeCmd(); it.run(); });

/* ---------------- boot */
TOURS.find(x => x.id === 't6').stops[12].check = true;
if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = store.get('td-theme', 'dark');
document.documentElement.classList.toggle('calm', S.motion);
const h0 = location.hash.slice(1); if (VIEWS[h0]) S.section = h0;
mapInit(); renderShell(); render({ nav: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeSeg(); placeNav(); });
})();
</script>
